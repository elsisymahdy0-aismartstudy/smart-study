<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Study AI</title>

<style>
body{
font-family:Arial,sans-serif;
max-width:800px;
margin:auto;
padding:20px;
background-color: #FCE6CE;
} 
textarea {
  width: 100%;
  height: 250px;        /* هذا الرقم هو الذي يكبر المربع الأبيض ويجعله واسعاً ومريحاً للكتابة */
  padding: 15px;         /* مسافة فارغة داخل المربع لكي لا يلتصق الكلام بالحواف */
  font-size: 16px;       /* حجم خط الكتابة داخل المربع */
  border-radius: 15px;   /* يجعل زوايا المربع الأبيض دائرية وناعمة وليست حادة */
  border: 2px solid #A0522D; /* لون إطار المربع (البني المتناسق مع موقعك) */
  box-sizing: border-box;
  background-color: #ffffff; /* التأكيد على أن لونه أبيض */
  resize: none;          /* يمنع المستخدم من تخريب شكل المربع بالخطأ */
}

    width: 100%;
    max-width: 100%;
    height: 180px; /* زودنا الارتفاع شوية عشان يكون أوسع */
    padding: 15px;
    font-size: 16px;
    border-radius: 15px; /* حواف دائرية ناعمة تليق مع الأزرار */
    border: 2px solid #A0522D; /* إطار جملي خفيف يحدد المربع */
    box-sizing: border-box;
    background-color: #ffffff;
    resize: vertical; /* يمنع المربع إنه يبوظ الشاشة بالعرض */
}

}
.btn {
    padding: 12px 25px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    background-color: #A0522D; /* اللون الجملي الغامق */
    color: white;
    box-shadow: 0 4px 6px rgba(0,0,0,0.15);
}
.image-container {
    text-align: center;
    margin: 25px 0;
}
.study-image {
    max-width: 85%;
    height: auto;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
}
 
}

button{
padding:10px 15px;
margin:5px;
cursor:pointer;
}

.result{
background:white;
padding:15px;
margin-top:15px;
border-radius:10px;
}
.buttons-container {
    display: flex;
    gap: 15px;
    justify-content: center;
    margin: 20px 0;
}

.btn {
    padding: 12px 25px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 25px;  
    cursor: pointer;
    background-color: #A0522D; /* اللون الجملي الغامق */
    color: white;              
    box-shadow: 0 4px 6px rgba(0,0,0,0.15);
    transition: transform 0.2s;
}

.btn:hover {
    transform: scale(1.03);
    background-color: #8B4513; 
}

.image-container {
    text-align: center;
    margin: 25px 0;
}

.study-image {
    max-width: 85%;       
    height: auto;
    border-radius: 15px;  
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); 
}
    
</style>
</head>

 
<h1>📚 Smart Study AI</h1>

<p>الصق النص هنا:</p>

<textarea id="text"></textarea>

<div class="buttons-container">
    <button class="btn" onclick="questions()">إنشاء أسئلة</button>
    <button class="btn" onclick="summarize()">تلخيص</button>
</div>

<div class="image-container">
    <img src="https://pin.it/2Lo9aBXZG" alt=" class="study-image">

<div id="output"></div>

<script>

function summarize(){

let text=document.getElementById("text").value;

if(text.length<20){
alert("اكتب نصاً أطول");
return;
}

let summary=text.substring(0,300);

document.getElementById("output").innerHTML=
`
<div class="result">
<h2>الملخص</h2>
<p>${summary}...</p>
</div>
`;
}

function questions(){

let text=document.getElementById("text").value;

let words=text.split(" ").filter(w=>w.length>5);

let html="<div class='result'><h2>أسئلة مراجعة</h2><ol>";

for(let i=0;i<Math.min(5,words.length);i++){
html += `<li>ما المقصود بـ ${words[i]} ؟</li>`;
}

html+="</ol></div>";

document.getElementById("output").innerHTML=html;
}

</script>

</body>
</html>
