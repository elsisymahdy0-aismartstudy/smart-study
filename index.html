<script src="https://unpkg.com/tesseract.js@2.1.4/dist/tesseract.min.js"></script>

<script>
// ربط عناصر واجهة موقعك بالكود التشغيلي
const openCamBtn = document.getElementById('open-cam-btn');
const cameraContainer = document.getElementById('camera-container');
const video = document.getElementById('video');
const captureBtn = document.getElementById('capture-btn');
const canvas = document.getElementById('canvas');
const textBox = document.getElementById('text');

// 1. تشغيل كاميرا الهاتف الخلفية عند الضغط على زر الكاميرا
if (openCamBtn) {
  openCamBtn.addEventListener('click', async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      video.srcObject = stream;
      cameraContainer.style.display = 'block';
      textBox.placeholder = "جاري تشغيل الكاميرا...";
    } catch (err) {
      alert("يرجى السماح للموقع بالوصول إلى الكاميرا من إعدادات المتصفح.");
    }
  });
}

// 2. التقاط الصورة واستخراج الكلام العربي منها تلقائياً
if (captureBtn) {
  captureBtn.addEventListener('click', () => {
    const context = canvas.getContext('2d');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    context.drawImage(video, 0, 0, video.videoWidth, video.videoHeight);

    // إيقاف الكاميرا فوراً للحفاظ على موارد الهاتف
    const stream = video.srcObject;
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
    }
    cameraContainer.style.display = 'none';

    textBox.value = "جاري قراءة النص العربي من الصورة، انتظر ثوانٍ معدودة... ⏳";

    const dataUrl = canvas.toDataURL('image/jpeg');
    
    // تشغيل محرك القراءة باللغة العربية
    Tesseract.recognize(
      dataUrl,
      'ara', 
      { logger: m => console.log(m) }
    ).then(({ data: { text } }) => {
      if(text.trim() === "") {
          textBox.value = "";
          textBox.placeholder = "لم نتمكن من التعرف على كلمات واضحة. يرجى إعادة التصوير بإضاءة أفضل وكتابة واضحة.";
      } else {
          textBox.value = text; // وضع النص المستخرج داخل المربع الأبيض المقاس المريح
      }
    }).catch(err => {
      textBox.value = "عذراً، حدث خطأ أثناء المعالجة البرمجية للصورة.";
    });
  });
}

// // 3. وظيفة زر التلخيص الخاص بك
async function summarize() {
    let text = document.getElementById("text").value;
    if (text.length < 20) {
        alert("اكتب أو صوّر نصاً أطول للتلخيص!");
        return;
    }
    
    document.getElementById("output").innerHTML = "جاري التلخيص بذكاء...";
    
    try {
        const response = await fetch("https://رابط-السيرفر-الخاص-بك.com/summarize", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ text: text })
        });
        
        const data = await response.json();

        document.getElementById("output").innerHTML = `
            <div class="result">
                <h2>الملخص الذكي</h2>
                <p>${data.summary}</p>
            </div>
        `;
    } catch (error) {
        document.getElementById("output").innerHTML = "حدث خطأ في الاتصال بالذكاء الاصطناعي.";
        console.error(error);
    }
}

// // 4. وظيفة زر إنشاء الأسئلة الخاص بك
async function questions() {
    let text = document.getElementById("text").value;
    if (text.length < 20) {
        alert("اكتب أو صوّر نصاً أطول لتوليد الأسئلة!");
        return;
    }

    document.getElementById("output").innerHTML = "جاري توليد الأسئلة...";

    try {
        const response = await fetch("https://رابط-السيرفر-الخاص-بك.com/questions", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ text: text })
        });
        
        const data = await response.json();

        document.getElementById("output").innerHTML = `
            <div class="result">
                <h2>أسئلة المراجعة الذكية</h2>
                <p style="white-space: pre-line;">${data.questions}</p>
            </div>
        `;
    } catch (error) {
        document.getElementById("output").innerHTML = "حدث خطأ في توليد الأسئلة.";
        console.error(error);
    }
}

</script>
