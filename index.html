<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ذكاء Study - منصة المذاكرة الذكية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #0a0a0f;
            color: #fff;
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        /* ===== القائمة الجانبية Sidebar ===== */
        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            width: 260px;
            height: 100vh;
            background: linear-gradient(145deg, #12121f, #08080f);
            padding: 20px;
            z-index: 100;
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
            padding: 10px;
        }

        .logo-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #a855f7, #4f46e5);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .logo-text {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(to left, #fff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-sub {
            font-size: 11px;
            color: #94a3b8;
            margin-top: -4px;
        }

        .nav-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-item {
            width: 100%;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            border-radius: 12px;
            color: #aaa;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            text-align: right;
            font-size: 14px;
        }

        .nav-link:hover, .nav-link.active {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.15), rgba(79, 70, 229, 0.15));
            color: #c4b5fd;
            border-right: 3px solid #a855f7;
        }

        .robot-mascot {
            margin-top: auto;
            text-align: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .robot-img {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* ===== المحتوى الرئيسي وحاوية العرض ===== */
        .main-content {
            margin-right: 260px;
            flex: 1;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: #11111b;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .welcome-title {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
            color: #fff;
        }

        .welcome-subtitle {
            font-size: 14px;
            color: #94a3b8;
            text-align: center;
            margin-bottom: 35px;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        /* كروت الخيارات وأزرار الميديا الدائرية */
        .upload-card {
            background: rgba(255, 255, 255, 0.02);
            border: 2px dashed rgba(168, 85, 247, 0.2);
            border-radius: 20px;
            padding: 40px 20px;
            text-align: center;
            transition: all 0.3s;
        }

        .upload-card:hover {
            border-color: #a855f7;
            background: rgba(168, 85, 247, 0.02);
        }

        .upload-icon-container {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px auto;
            background: rgba(255,255,255,0.03);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
        }

        .action-buttons-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 25px;
        }

        .media-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: white;
            transition: all 0.2s;
        }

        .btn-camera { background: linear-gradient(135deg, #a855f7, #7c3aed); }
        .btn-gallery { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
        .btn-camera:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-gallery:hover { opacity: 0.9; transform: translateY(-1px); }

        /* تجميل حاوية الأسئلة والاختيارات لتطابق الصورة المرفقة */
        .question-box {
            position: relative;
        }

        .question-badge {
            display: inline-block;
            background: rgba(168, 85, 247, 0.15);
            color: #c4b5fd;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .question-text {
            font-size: 19px;
            font-weight: 600;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #f1f5f9;
        }

        .answers-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .answer-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px 20px;
            border-radius: 14px;
            text-align: right;
            color: #cbd5e1;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.2s ease;
        }

        .answer-btn:hover:not(:disabled) {
            border-color: #a855f7;
            background: rgba(168, 85, 247, 0.05);
            color: #fff;
        }

        .answer-btn:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* تنسيق صندوق الإجابة الخاطئة/الصحيحة لمنع الـ object */
        #resultMessage {
            margin-top: 20px;
            font-size: 15px;
            font-weight: 600;
        }

        .next-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            float: left;
            margin-top: 20px;
            transition: all 0.2s;
        }

        .hidden { display: none; }
        .preview-grid { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 15px; }
        .preview-grid img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; border: 1px solid #a855f7; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">
            <div class="logo-icon">🧬</div>
            <div>
                <div class="logo-text">ذكاء Study</div>
                <div class="logo-sub">تعلم بذكاء، وافهم أسرع</div>
            </div>
        </div>
        <ul class="nav-menu">
            <li class="nav-item"><button class="nav-link active" onclick="showSection('home')">🏠 الصفحة الرئيسية</button></li>
            <li class="nav-item"><button class="nav-link" onclick="startStandardQuiz()">📝 اختبار قياسي سريع</button></li>
        </ul>
        <div class="robot-mascot">
            <div class="robot-img">🤖</div>
        </div>
    </div>

    <div class="main-content">
        <div class="container">
            
            <div id="homeSection" class="section active">
                <h1 class="welcome-title">مرحباً بك في ذكاء Study!</h1>
                <p class="welcome-subtitle">✨ تعلم بذكاء، وفهم أسرع، وتفوق بسهولة</p>
                
                <div class="upload-card">
                    <div class="upload-icon-container">📷</div>
                    <h3 style="font-size:18px; margin-bottom:8px;">التقاط صورة للكتاب</h3>
                    <p style="color:#94a3b8; font-size:13px; padding:0 10px;">اختر طريقة إضافة الصورة لكي يقوم الذكاء الاصطناعي بقراءتها وصياغة اختبار تفاعلي فوري لك.</p>
                    
                    <div class="action-buttons-group">
                        <button type="button" class="media-btn btn-camera" onclick="document.getElementById('cameraInputReal').click();">
                            📸 فتح الكاميرا فوراً
                        </button>
                        <button type="button" class="media-btn btn-gallery" onclick="document.getElementById('galleryInputReal').click();">
                            🖼️ اختيار من المعرض
                        </button>
                    </div>
                    <div id="mainPreviewContainer" class="preview-grid"></div>
                </div>
            </div>

            <div id="quizSection" class="section">
                <div style="display: flex; justify-content: space-between; margin-bottom: 25px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; color: #a3a3c2;">
                    <div id="scoreDisplay">النقاط: 0</div>
                    <div id="quizTitleHeader">🧠 الفحص والتقييم الذكي</div>
                </div>
                <div id="quizContainer"></div>
            </div>

        </div>
    </div>
<script>
// المتغيرات العامة لإدارة حالة التطبيق
let questions = [];
let currentQuestionIndex = 0;
let score = 0;

function showSection(sectionId) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    const target = document.getElementById(sectionId + 'Section') || document.getElementById(sectionId);
    if(target) target.classList.add('active');
}

function startStandardQuiz() {
    questions = [
        {
            question: "ما هو معنى زاوية السقوط في انعكاس الضوء؟",
            type: "multiple",
            options: [
                "أ) الزاوية المحصورة بين الشعاع المنعكس والعمود المقام",
                "ب) الزاوية المحصورة بين الشعاع الساقط والعمود المقام",
                "ج) الزاوية المحصورة بين الشعاع الساقط والشعاع المنعكس",
                "د) الزاوية المحصورة بين الشعاع المنعكس والسطح العاكس"
            ],
            answer: "ب) الزاوية المحصورة بين الشعاع الساقط والعمود المقام"
        }
    ];
    currentQuestionIndex = 0;
    score = 0;
    showSection('quiz');
    showQuestion();
}

function showQuestion() {
    if (questions.length === 0) return;
    
    const container = document.getElementById('quizContainer');
    const scoreDiv = document.getElementById('scoreDisplay');
    if(scoreDiv) scoreDiv.innerText = `النقاط: ${score}`;
    
    const q = questions[currentQuestionIndex];
    let typeBadge = q.type === 'multiple' ? '💡 اختيار من متعدد' : '⚖️ صح / خطأ';
    
    let contentHtml = '';
    if (q.type === 'multiple') {
        contentHtml = '<div class="answers-list">';
        q.options.forEach(opt => {
            // نمرر كلمة 'this' بدقة لترسل العنصر المختار مباشرة للدالة
            contentHtml += `<button class="answer-btn" onclick="checkAnswer(this, \`${q.answer}\`)">${opt}</button>`;
        });
        contentHtml += '</div>';
    } else {
        contentHtml = `
            <div class="answers-list" style="flex-direction: row; gap: 20px; justify-content: center;">
                <button class="answer-btn" style="flex: 1; text-align: center;" onclick="checkAnswer(this, 'صح')">صح</button>
                <button class="answer-btn" style="flex: 1; text-align: center;" onclick="checkAnswer(this, 'خطأ')">خطأ</button>
            </div>
        `;
    }

    container.innerHTML = `
        <div class="question-box">
            <span class="question-badge">${typeBadge}</span>
            <div class="question-text">
                سؤال ${currentQuestionIndex + 1} من ${questions.length}: <br><br> ${q.question}
            </div>
            ${contentHtml}
            <div id="resultMessage"></div>
            <div style="overflow: hidden; width: 100%;">
                <button class="next-btn hidden" id="nextQuestionBtn">السؤال التالي ←</button>
            </div>
            
            <div class="media-controls" style="margin-top: 30px; display: flex; gap: 10px; justify-content: center; border-top: 1px dashed rgba(255,255,255,0.05); padding-top: 20px;">
                <button type="button" class="media-btn btn-camera" style="padding: 10px 15px; font-size: 13px;" onclick="document.getElementById('cameraInputReal').click();">
                    📸 لقطة كاميرا فورية
                </button>
                <button type="button" class="media-btn btn-gallery" style="padding: 10px 15px; font-size: 13px;" onclick="document.getElementById('galleryInputReal').click();">
                    🖼️ اختيار من المعرض
                </button>
            </div>
            <div id="previewImagesContainer" class="preview-grid"></div>
        </div>
    `;

    setupQuestionEvents();
}

// دالة فحص الإجابة الذكية - تم إصلاحها لمنع ظهور [object HTMLButtonElement] بالكامل
function checkAnswer(userAnswer, correctAnswer) {
    const resultDiv = document.getElementById('resultMessage');
    const nextBtn = document.getElementById('nextQuestionBtn');
    if (!resultDiv) return;

    // استخلاص النص الحقيقي من داخل الزر بدلاً من قراءة الكائن كعنصر DOM
    let userText = "";
    if (userAnswer instanceof HTMLElement) {
        userText = userAnswer.innerText || userAnswer.textContent;
    } else {
        userText = String(userAnswer);
    }

    userText = userText.trim();
    const cleanCorrectAnswer = String(correctAnswer).trim();

    // إغلاق كل أزرار الإجابات لمنع التلاعب
    const buttons = document.querySelectorAll('.answers-list .answer-btn');
    buttons.forEach(btn => btn.disabled = true);

    // التحقق والمقارنة الذكية للنصوص المكتوبة
    if (userText === cleanCorrectAnswer || userText.includes(cleanCorrectAnswer) || cleanCorrectAnswer.includes(userText)) {
        resultDiv.innerHTML = "<p style='color: #10b981; font-weight: bold;'>✅ إجابة صحيحة وممتازة!</p>";
        score += 10;
        const scoreDiv = document.getElementById('scoreDisplay');
        if(scoreDiv) scoreDiv.innerText = `النقاط: ${score}`;
    } else {
        resultDiv.innerHTML = `<p style='color: #ef4444; font-weight: bold;'>❌ إجابة خاطئة، الإجابة الصحيحة هي: <br> ${cleanCorrectAnswer}</p>`;
    }

    if (nextBtn) nextBtn.classList.remove('hidden');
}

function setupQuestionEvents() {
    const nextBtn = document.getElementById('nextQuestionBtn');
    if (nextBtn) {
        nextBtn.onclick = function() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                showQuestion();
            } else {
                endQuiz();
            }
        };
    }
}

function endQuiz() {
    const container = document.getElementById('quizContainer');
    if (container) {
        container.innerHTML = `
            <div class="question-box" style="text-align: center; padding: 30px 10px;">
                <h2 style="color: #10b981; margin-bottom: 15px;">🎉 مبروك! انتهى الاختبار</h2>
                <p style="font-size: 18px; font-weight: bold; margin-bottom: 25px;">مجموع نقاطك النهائي: ${score}</p>
                <button class="media-btn btn-camera" style="width: auto; padding: 12px 30px; display: inline-flex;" onclick="resetQuiz()">🏠 القائمة الرئيسية</button>
            </div>
        `;
    }
}

function resetQuiz() {
    questions = [];
    currentQuestionIndex = 0;
    score = 0;
    const mainPreview = document.getElementById('mainPreviewContainer');
    if(mainPreview) mainPreview.innerHTML = '';
    showSection('home');
}

async function sendImagesToSmartWorker(files) {
    showSection('quiz');
    const container = document.getElementById('quizContainer');
    if (container) {
        container.innerHTML = `
            <div class="question-box" style="text-align: center; padding: 40px 20px;">
                <p style='color: #a855f7; font-weight: bold; width: 100%; text-align: center;'>⏳ جاري معالجة الصور بالذكاء الاصطناعي وتوليد الأسئلة...</p>
            </div>
        `;
    }

    const formData = new FormData();
    for (let i = 0; i < files.length; i++) {
        formData.append("images", files[i]);
    }

    try {
        const workerUrl = "/api/quiz"; 
        const response = await fetch(workerUrl, { method: "POST", body: formData });
        if (!response.ok) throw new Error("استجابة غير مستقرة من السيرفر.");

        const data = await response.json();
        if (data && data.questions && data.questions.length > 0) {
            questions = data.questions;
            currentQuestionIndex = 0;
            showQuestion();
        } else {
            alert("لم يستطع النظام صياغة أسئلة واضحة، تأكد من وضوح الصورة المرفوعة.");
            resetQuiz();
        }
    } catch (error) {
        alert("خطأ في الاتصال بالـ Worker: " + error.message);
        resetQuiz();
    }
}

function handleDirectFileSelection(event) {
    const files = event.target.files;
    const mainPreview = document.getElementById('mainPreviewContainer');
    const quizPreview = document.getElementById('previewImagesContainer');
    
    if (mainPreview) mainPreview.innerHTML = ''; 

    if (files.length > 0) {
        for (let i = 0; i < files.length; i++) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.createElement('img');
                img.src = e.target.result;
                img.style.width = '65px';
                img.style.height = '65px';
                img.style.objectFit = 'cover';
                img.style.borderRadius = '8px';
                img.style.border = '1px solid #a855f7';
                
                if (mainPreview) mainPreview.appendChild(img.cloneNode(true));
                if (quizPreview) quizPreview.appendChild(img.cloneNode(true));
            }
            reader.readAsDataURL(files[i]);
        }
        sendImagesToSmartWorker(files);
    }
}
</script>

<input type="file" id="cameraInputReal" accept="image/*" capture="environment" style="display: none;" onchange="handleDirectFileSelection(event)">
<input type="file" id="galleryInputReal" accept="image/*" multiple style="display: none;" onchange="handleDirectFileSelection(event)">

</body>
</html>
