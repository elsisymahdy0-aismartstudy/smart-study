<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ذكاء Study - التعلم الذكي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* ===== نفس الـ CSS اللي عندك ===== */
        :root {
            --bg-body: #f8f9fd;
            --card-bg: #ffffff;
            --text-main: #1a1a2e;
            --text-sub: #6b7280;
            --primary-purple: #7c3aed;
            --primary-gradient: linear-gradient(135deg, #7c3aed 0%, #a855f7 50%, #c084fc 100%);
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-yellow: #f59e0b;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo',sans-serif; }
        body { background:var(--bg-body); color:var(--text-main); min-height:100vh; padding-bottom:90px; }
        .hidden { display:none !important; }
        
        /* ===== شاشة الترحيب ===== */
        .welcome-screen {
            position:fixed; top:0; left:0; right:0; bottom:0;
            background:linear-gradient(135deg, #1a0a3e 0%, #2d1b69 50%, #4c1d95 100%);
            z-index:99999;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            padding:20px;
            animation:fadeIn 0.8s ease-out;
        }
        .welcome-screen.hidden { display:none !important; }
        
        .welcome-character {
            font-size:120px;
            animation:float 3s ease-in-out infinite;
            filter:drop-shadow(0 0 40px rgba(124,58,237,0.5));
        }
        .welcome-title {
            color:#fff;
            font-size:32px;
            font-weight:900;
            margin-top:10px;
            text-align:center;
            background:linear-gradient(90deg,#c084fc,#a855f7,#7c3aed);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
        }
        .welcome-text {
            color:rgba(255,255,255,0.8);
            font-size:16px;
            text-align:center;
            max-width:400px;
            line-height:1.8;
            margin:12px 0 24px;
        }
        .welcome-btn {
            background:linear-gradient(135deg,#7c3aed,#a855f7);
            color:#fff;
            border:none;
            padding:16px 40px;
            border-radius:50px;
            font-size:18px;
            font-weight:800;
            cursor:pointer;
            animation:pulse 2s ease-in-out infinite;
            box-shadow:0 4px 30px rgba(124,58,237,0.4);
        }
        .welcome-btn:hover { transform:scale(1.05); }
        
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
        @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-15px); } }
        @keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.03); } }
        
        /* ===== شخصية الأنمي المساعدة ===== */
        .ai-assistant {
            position:fixed;
            bottom:90px;
            right:15px;
            z-index:1000;
            cursor:pointer;
            transition:all 0.3s;
        }
        .ai-assistant:hover { transform:scale(1.1); }
        .ai-assistant .character {
            font-size:65px;
            filter:drop-shadow(0 4px 15px rgba(124,58,237,0.3));
            animation:float 3s ease-in-out infinite;
        }
        .ai-assistant .speech-bubble {
            position:absolute;
            bottom:75px;
            right:0;
            background:var(--card-bg);
            border-radius:16px 16px 4px 16px;
            padding:12px 16px;
            max-width:220px;
            font-size:12px;
            color:var(--text-main);
            box-shadow:0 4px 20px rgba(0,0,0,0.1);
            border:1px solid var(--border-color);
            display:none;
            font-weight:600;
        }
        .ai-assistant .speech-bubble::after {
            content:'';
            position:absolute;
            bottom:-10px;
            right:20px;
            border-left:10px solid transparent;
            border-right:10px solid transparent;
            border-top:10px solid var(--card-bg);
        }
        .ai-assistant:hover .speech-bubble { display:block; }
        
        /* ===== تأثيرات الصوت ===== */
        .correct-flash {
            animation:correctFlash 0.5s ease;
        }
        .wrong-flash {
            animation:wrongFlash 0.5s ease;
        }
        @keyframes correctFlash {
            0%,100% { background:transparent; }
            50% { background:rgba(16,185,129,0.2); }
        }
        @keyframes wrongFlash {
            0%,100% { background:transparent; }
            50% { background:rgba(239,68,68,0.2); }
        }
        
        /* باقي الـ CSS بتاعك */
        .grade-screen { position:fixed; top:0; left:0; right:0; bottom:0; background:linear-gradient(135deg,#1a0a3e,#2d1b69,#4c1d95); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; overflow-y:auto; }
        .grade-screen.hidden { display:none !important; }
        /* ... باقي الـ CSS القديم ... */
    </style>
</head>
<body>

<!-- ===== شاشة الترحيب (تظهر مرة واحدة) ===== -->
<div id="welcomeScreen" class="welcome-screen">
    <div class="welcome-character">🧑‍🏫</div>
    <div class="welcome-title">🌟 مرحباً بك في ذكاء Study!</div>
    <div class="welcome-text">
        📚 أنا مساعدك الذكي للتعلم!<br>
        🤖 هساعدك تفهم دروسك، تلخص كتبك، وتجاوب على أسئلتك.<br>
        💪 خليك متفائل، كل يوم جديد هو فرصة للتعلم!
    </div>
    <button class="welcome-btn" onclick="startApp()">
        🚀 ابدأ رحلتك التعليمية
    </button>
</div>

<!-- ===== شخصية الأنمي المساعدة ===== -->
<div class="ai-assistant" id="aiAssistant">
    <div class="speech-bubble" id="assistantBubble">💡 اسألني أي شيء!</div>
    <div class="character" id="assistantEmoji">🧑‍🏫</div>
</div>

<!-- ===== بقية الموقع ===== -->
<div id="appContent">
    <!-- GRADE SELECTION SCREEN -->
    <div id="gradeScreen" class="grade-screen">
        <div class="brain-emoji">🧠</div>
        <h1>أهلاً بك في ذكاء Study!</h1>
        <p>اختر مستواك الدراسي لنبدأ رحلتك التعليمية الذكية</p>
        <div class="grade-grid">
            <!-- ... كل أزرار الصفوف ... -->
        </div>
    </div>
    
    <!-- باقي الموقع -->
    <div id="restOfSite">
        <!-- كل المحتوى التاني -->
    </div>
</div>

};

// ===== متغيرات =====
let welcomeShown = localStorage.getItem('welcomeShown');

// ===== تشغيل الأصوات =====
function playSound(type) {
    try {
        if (type === 'correct') {
            sounds.correct.play();
            document.body.classList.add('correct-flash');
            setTimeout(() => document.body.classList.remove('correct-flash'), 500);
        } else if (type === 'wrong') {
            sounds.wrong.play();
            document.body.classList.add('wrong-flash');
            setTimeout(() => document.body.classList.remove('wrong-flash'), 500);
        } else if (type === 'correctAnswer') {
            sounds.correctAnswer.play();
        } else if (type === 'welcome') {
            sounds.welcome.play();
        }
    } catch(e) { console.log('🔇 صوت مش شغال'); }
}

// ===== شاشة الترحيب =====
function startApp() {
    document.getElementById('welcomeScreen').classList.add('hidden');
    localStorage.setItem('welcomeShown', 'true');
    playSound('welcome');
    showToast('🎉 مرحباً بك في رحلة التعلم!', 'success');
    // اختيار الشخصية حسب التقدم
    updateAssistant();
}

// ===== تحديث شخصية الأنمي =====
function updateAssistant() {
    const emoji = document.getElementById('assistantEmoji');
    const bubble = document.getElementById('assistantBubble');
    const acc = parseInt(document.getElementById('statAcc')?.innerText || '0');
    
    if (acc >= 80) {
        emoji.textContent = '🧙‍♂️';
        bubble.textContent = '🌟 أنت خبير! استمر!';
    } else if (acc >= 60) {
        emoji.textContent = '🧑‍🎓';
        bubble.textContent = '📚 أداء ممتاز!';
    } else if (acc >= 40) {
        emoji.textContent = '🧑‍🏫';
        bubble.textContent = '💪 استمر، أنت في الطريق الصحيح!';
    } else if (acc >= 20) {
        emoji.textContent = '🧑‍💻';
        bubble.textContent = '📖 كل يوم تتعلم شيء جديد!';
    } else {
        emoji.textContent = '🧑‍🏫';
        bubble.textContent = '💡 اسألني أي شيء!';
    }
}

// ===== دالة التلخيص مع الصوت =====
const originalGenerateSummary = generateSummary;
generateSummary = async function() {
    playSound('welcome');
    await originalGenerateSummary();
};

// ===== دالة الإجابة مع الصوت =====
const originalCheckAnswer = checkAnswer;
checkAnswer = function(userAns, correctAns) {
    const isRight = userAns.trim() === correctAns.trim();
    if (isRight) {
        playSound('correct');
        showToast('🎉 إجابة صحيحة! أحسنت!', 'success');
    } else {
        playSound('wrong');
        showToast('💪 حاول مرة أخرى!', 'warning');
    }
    originalCheckAnswer(userAns, correctAns);
};

// ===== دالة إنهاء الاختبار مع الصوت =====
const originalFinishQuiz = finishQuiz;
finishQuiz = function() {
    const percent = currentQuiz.length > 0 ? Math.round((score / currentQuiz.length) * 100) : 0;
    if (percent >= 70) {
        playSound('correctAnswer');
    } else {
        playSound('wrong');
    }
    originalFinishQuiz();
};

// ===== تحديث الشخصية بعد كل إجابة =====
const originalUpdateStatsUI = updateStatsUI;
updateStatsUI = function() {
    originalUpdateStatsUI();
    updateAssistant();
};

// ===== تشغيل التطبيق =====
document.addEventListener('DOMContentLoaded', function() {
    // لو شاشة الترحيب ظهرت قبل كده، اختفيها
    if (localStorage.getItem('welcomeShown') === 'true') {
        document.getElementById('welcomeScreen').classList.add('hidden');
    }
    updateAssistant();
    // تشغيل الصوت الترحيبي (مرة واحدة)
    if (!localStorage.getItem('welcomeSoundPlayed')) {
        setTimeout(() => {
            playSound('welcome');
            localStorage.setItem('welcomeSoundPlayed', 'true');
        }, 1000);
    }
});
</script>
