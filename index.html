<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة Study الذكية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --text: #f8fafc;
            --text-sub: #94a3b8;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --border: #334155;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 20px; }

        .container { max-width: 800px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 25px; }
        header h1 { color: var(--primary); font-size: 28px; }
        header p { color: var(--text-sub); font-size: 14px; }

        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
        
        .upload-zone {
            border: 2px dashed var(--primary); border-radius: 12px; padding: 25px; text-align: center;
            cursor: pointer; background: rgba(139, 92, 246, 0.05); transition: 0.3s;
        }
        .upload-zone:hover { background: rgba(139, 92, 246, 0.15); }

        .btn {
            background: var(--primary); color: white; border: none; padding: 12px 20px;
            border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; font-size: 15px; margin-top: 10px; transition: 0.2s;
        }
        .btn:hover { background: var(--primary-hover); }

        /* أزرار خيارات الاختبار الثلاثة */
        .quiz-modes-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        .mode-btn {
            background: #0f172a; border: 2px solid var(--border); color: var(--text);
            padding: 15px 8px; border-radius: 12px; cursor: pointer; text-align: center;
            font-weight: bold; font-size: 14px; transition: 0.3s;
            display: flex; flex-direction: column; align-items: center; gap: 5px;
        }
        .mode-btn:hover { border-color: var(--primary); transform: translateY(-2px); }
        .mode-btn.quick { border-color: var(--success); }
        .mode-btn.full { border-color: var(--primary); }
        .mode-btn.challenge { border-color: var(--danger); }

        .hidden { display: none; }
        
        .summary-box { background: #0f172a; border-right: 4px solid var(--primary); padding: 15px; border-radius: 8px; line-height: 1.8; margin-top: 15px; }

        .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .timer-badge { background: var(--warning); color: #000; padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; }

        .question-card { background: #0f172a; padding: 20px; border-radius: 12px; }
        .badge { background: var(--primary); padding: 4px 10px; border-radius: 20px; font-size: 12px; display: inline-block; margin-bottom: 10px; }
        
        .options-grid { display: grid; gap: 10px; margin-top: 15px; }
        .opt-btn {
            background: var(--card-bg); border: 1px solid var(--border); color: var(--text);
            padding: 12px; border-radius: 8px; text-align: right; cursor: pointer; font-size: 15px;
        }
        .opt-btn:hover { border-color: var(--primary); }

        input[type="text"] {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border);
            background: #0f172a; color: white; margin-top: 10px; font-size: 15px;
        }

        .feedback-box { padding: 15px; border-radius: 8px; margin-top: 15px; font-weight: bold; }
        .feedback-box.correct { background: rgba(34, 197, 94, 0.2); color: var(--success); border: 1px solid var(--success); }
        .feedback-box.wrong { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); }

        .loading { text-align: center; color: var(--primary); font-size: 16px; margin: 20px 0; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🧠 منصة Study للذكاء الاصطناعي</h1>
        <p>ارفع صورة الدرس واختر نظام الاختبار المناسب لك</p>
    </header>

    <div class="card">
        <div class="upload-zone" onclick="document.getElementById('imgInput').click()">
            📸 اضغط هنا لالتقاط أو اختيار صورة الدرس
            <input type="file" id="imgInput" accept="image/*" class="hidden" onchange="handleImageSelection(event)">
        </div>

        <div id="quizTypeSelector" class="hidden">
            <h3 style="margin-top: 20px; text-align: center; font-size: 15px;">اختر نوع الاختبار:</h3>
            <div class="quiz-modes-grid">
                <button class="mode-btn quick" onclick="startGeneratedQuiz('quick')">
                    ⚡ <span>اختبار سريع</span>
                    <small style="color: var(--text-sub);">(5 أسئلة)</small>
                </button>
                <button class="mode-btn full" onclick="startGeneratedQuiz('full')">
                    📄 <span>امتحان كامل</span>
                    <small style="color: var(--text-sub);">(15 سؤالاً)</small>
                </button>
                <button class="mode-btn challenge" onclick="startGeneratedQuiz('challenge')">
                    🔥 <span>وضع التحدي</span>
                    <small style="color: var(--text-sub);">(عباقرة + تايمر)</small>
                </button>
            </div>
        </div>

        <div id="loading" class="loading hidden">⏳ جاري تحليل الدرس وتوليد الأسئلة بواسطة الذكاء الاصطناعي...</div>
    </div>

    <div id="summarySection" class="card hidden">
        <h2>📝 ملخص الدرس</h2>
        <div id="summaryContent" class="summary-box"></div>
    </div>

    <div id="quizSection" class="card hidden">
        <div class="quiz-header">
            <h2>🎯 السؤال (<span id="qIndex">1</span> من <span id="qTotal">0</span>)</h2>
            <div id="timerBox" class="timer-badge hidden">⏱️ المتبقي: <span id="timerVal">20</span> ثانية</div>
        </div>

        <div class="question-card">
            <span class="badge" id="qType">نوع السؤال</span>
            <h3 id="qText">السؤال سيظهر هنا...</h3>

            <div id="mcqOptions" class="options-grid hidden"></div>

            <div id="textInputBox" class="hidden">
                <input type="text" id="userAnswerText" placeholder="اكتب إجابتك النموذجية هنا...">
                <button class="btn" onclick="submitTextAnswer()">تحقق من الإجابة ⚡</button>
            </div>

            <div id="feedback" class="feedback-box hidden"></div>
            <button id="nextBtn" class="btn hidden" onclick="nextQuestion()">السؤال التالي ➡️</button>
        </div>
    </div>
</div>

<script>
    const WORKER_URL = "https://smart-study-api.elsisymahdy0.workers.dev";
    
    let selectedImageBase64 = null;
    let currentData = null;
    let currentQIndex = 0;
    let timerInterval = null;
    let isChallengeMode = false;

    function handleImageSelection(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            selectedImageBase64 = e.target.result;
            document.getElementById('quizTypeSelector').classList.remove('hidden');
        };
        reader.readAsDataURL(file);
    }

    async function startGeneratedQuiz(type) {
        if (!selectedImageBase64) return;

        isChallengeMode = (type === 'challenge');
        document.getElementById('loading').classList.remove('hidden');
        document.getElementById('quizTypeSelector').classList.add('hidden');

        try {
            const res = await fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'analyze', image: selectedImageBase64, quizType: type })
            });

            const rawData = await res.json();
            const aiResponse = JSON.parse(rawData.choices[0].message.content);
            
            currentData = aiResponse;
            currentQIndex = 0;

            displaySummary(aiResponse.summary);
            startQuiz(aiResponse.questions);

        } catch (err) {
            alert("حدث خطأ، تأكد من تعديل كود الـ Worker وحفظه!");
            console.error(err);
            document.getElementById('quizTypeSelector').classList.remove('hidden');
        } finally {
            document.getElementById('loading').classList.add('hidden');
        }
    }

    function displaySummary(summary) {
        document.getElementById('summaryContent').innerText = summary;
        document.getElementById('summarySection').classList.remove('hidden');
    }

    function startQuiz(questions) {
        document.getElementById('quizSection').classList.remove('hidden');
        document.getElementById('qTotal').innerText = questions.length;
        renderQuestion();
    }

    function renderQuestion() {
        clearInterval(timerInterval);
        const q = currentData.questions[currentQIndex];
        document.getElementById('qIndex').innerText = currentQIndex + 1;
        document.getElementById('qText').innerText = q.question;
        document.getElementById('feedback').classList.add('hidden');
        document.getElementById('nextBtn').classList.add('hidden');

        const mcqBox = document.getElementById('mcqOptions');
        const textInputBox = document.getElementById('textInputBox');
        mcqBox.innerHTML = '';
        document.getElementById('userAnswerText').value = '';

        const timerBox = document.getElementById('timerBox');
        if (isChallengeMode) {
            timerBox.classList.remove('hidden');
            startTimer(20);
        } else {
            timerBox.classList.add('hidden');
        }

        if (q.type === 'mcq' || q.type === 'tf') {
            mcqBox.classList.remove('hidden');
            textInputBox.classList.add('hidden');

            const opts = q.type === 'tf' ? ['صح', 'خطأ'] : q.options;
            opts.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.innerText = opt;
                btn.onclick = () => {
                    clearInterval(timerInterval);
                    evaluateMCQ(opt, q.correctAnswer, q.explanation);
                };
                mcqBox.appendChild(btn);
            });
            document.getElementById('qType').innerText = q.type === 'tf' ? 'صح أو خطأ' : 'اختيار من متعدد';

        } else {
            mcqBox.classList.add('hidden');
            textInputBox.classList.remove('hidden');
            document.getElementById('qType').innerText = q.type === 'fill' ? 'أكمل الجملة' : 'ما المقصد / اشرح';
        }
    }

    function startTimer(seconds) {
        let timeLeft = seconds;
        document.getElementById('timerVal').innerText = timeLeft;

        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timerVal').innerText = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                showFeedback(false, "⏰ انتهى الوقت المحدد للسؤال!");
            }
        }, 1000);
    }

    function evaluateMCQ(selected, correct, explanation) {
        const isCorrect = selected.trim() === correct.trim();
        showFeedback(isCorrect, isCorrect ? "إجابة صحيحة وممتازة! 🎉" : `إجابة خاطئة ❌. الإجابة الصحيحة هي: (${correct}). ${explanation || ''}`);
    }

    async function submitTextAnswer() {
        clearInterval(timerInterval);
        const uAns = document.getElementById('userAnswerText').value.trim();
        if(!uAns) { alert("من فضلك اكتب إجابتك أولاً!"); return; }

        const q = currentData.questions[currentQIndex];
        document.getElementById('loading').classList.remove('hidden');

        try {
            const res = await fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'evaluate',
                    question: q.question,
                    correctAnswer: q.correctAnswer,
                    userAnswer: uAns
                })
            });

            const rawData = await res.json();
            const result = JSON.parse(rawData.choices[0].message.content);

            showFeedback(result.isCorrect, result.isCorrect 
                ? "✅ إجابة صحيحة ومكتملة المعنى!" 
                : `❌ إجابة غير دقيقة أو غير مكتملة. \nالتوضيح: ${result.feedback}`);

        } catch (err) {
            console.error(err);
            alert("حدث خطأ في تقييم الإجابة.");
        } finally {
            document.getElementById('loading').classList.add('hidden');
        }
    }

    function showFeedback(isCorrect, msg) {
        const fb = document.getElementById('feedback');
        fb.innerText = msg;
        fb.className = `feedback-box ${isCorrect ? 'correct' : 'wrong'}`;
        fb.classList.remove('hidden');
        document.getElementById('nextBtn').classList.remove('hidden');
    }

    function nextQuestion() {
        currentQIndex++;
        if (currentQIndex < currentData.questions.length) {
            renderQuestion();
        } else {
            alert("🏆 ألمعي! لقد أنهيت هذا الاختبار بنجاح.");
        }
    }
</script>
</body>
</html>
