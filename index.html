<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Study AI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: auto;
            padding: 20px;
            background-color: #FCE6CE;
            text-align: center;
        }
        h1 {
            color: #A0522D;
            margin-bottom: 10px;
        }
        .icon {
            font-size: 40px;
        }
        textarea {
            width: 100%;
            height: 250px;
            padding: 15px;
            font-size: 16px;
            border-radius: 15px;
            border: 2px solid #A0522D;
            box-sizing: border-box;
            resize: vertical;
            margin: 15px 0;
            background: white;
        }
        .btn {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            margin: 10px;
            transition: 0.3s;
        }
        .btn-camera {
            background-color: #A0522D;
            color: white;
        }
        .btn-camera:hover {
            background-color: #8B4513;
        }
        .btn-action {
            background-color: #CD853F;
            color: white;
        }
        .btn-action:hover {
            background-color: #A0522D;
        }
        #preview {
            max-width: 100%;
            max-height: 300px;
            border-radius: 15px;
            margin: 15px 0;
            display: none;
        }
        #status {
            color: #A0522D;
            font-weight: bold;
            margin: 10px 0;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="icon">📚</div>
    <h1>Smart Study AI</h1>

    <textarea id="result" placeholder="النص المقروء سيظهر هنا...">جاري قراءة النص العربي من الصورة، انتظر ثوانٍ معدودة... ⏳</textarea>

    <div>
        <button class="btn btn-camera" onclick="openCamera()">📷 افتح الكاميرا لتصوير الكتاب</button>
    </div>

    <div>
        <button class="btn btn-action" onclick="createQuestions()">إنشاء أسئلة</button>
        <button class="btn btn-action" onclick="summarize()">تلخيص</button>
    </div>

    <img id="preview" alt="معاينة الصورة">

    <input type="file" id="fileInput" accept="image/*" capture="environment" class="hidden" onchange="handleImage(event)">

    <script>
        // ============================================
        // رابط Cloudflare Worker بتاعك
        // ============================================
        const WORKER_URL = "https://smart-study-ai.YOUR_SUBDOMAIN.workers.dev";
        // غيّر YOUR_SUBDOMAIN بالـ subdomain بتاعك

        // ============================================
        // فتح الكاميرا
        // ============================================
        function openCamera() {
            document.getElementById('fileInput').click();
        }

        // ============================================
        // معالجة الصورة
        // ============================================
        async function handleImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const preview = document.getElementById('preview');
            preview.src = URL.createObjectURL(file);
            preview.style.display = 'block';

            const resultArea = document.getElementById('result');
            resultArea.value = '⏳ جاري قراءة النص من الصورة، انتظر قليلاً...';

            try {
                const base64 = await fileToBase64(file);
                const text = await callWorker('readImage', { imageBase64: base64 });
                resultArea.value = text;

            } catch (error) {
                resultArea.value = '❌ حدث خطأ: ' + error.message;
                console.error(error);
            }
        }

        // ============================================
        // تحويل ملف لـ Base64
        // ============================================
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // ============================================
        // استدعاء Cloudflare Worker
        // ============================================
        async function callWorker(action, data) {
            const response = await fetch(WORKER_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    action: action,
                    ...data
                })
            });

            if (!response.ok) {
                throw new Error('خطأ في الاتصال بالخادم');
            }

            const result = await response.json();

            if (result.error) {
                throw new Error(result.error.message || 'خطأ غير معروف');
            }

            if (result.choices && result.choices[0]) {
                return result.choices[0].message.content;
            } else {
                throw new Error('لم يتم العثور على نتيجة');
            }
        }

        // ============================================
        // إنشاء أسئلة
        // ============================================
        async function createQuestions() {
            const text = document.getElementById('result').value;
            if (!text || text.includes('⏳') || text.includes('❌')) {
                alert('الرجاء التقاط صورة وقراءة النص أولاً!');
                return;
            }

            document.getElementById('result').value = '⏳ جاري إنشاء الأسئلة...';

            try {
                const result = await callWorker('questions', { text: text });
                document.getElementById('result').value = result;

            } catch (error) {
                document.getElementById('result').value = '❌ خطأ: ' + error.message;
            }
        }

        // ============================================
        // تلخيص
        // ============================================
        async function summarize() {
            const text = document.getElementById('result').value;
            if (!text || text.includes('⏳') || text.includes('❌')) {
                alert('الرجاء التقاط صورة وقراءة النص أولاً!');
                return;
            }

            document.getElementById('result').value = '⏳ جاري التلخيص...';

            try {
                const result = await callWorker('summarize', { text: text });
                document.getElementById('result').value = result;

            } catch (error) {
                document.getElementById('result').value = '❌ خطأ: ' + error.message;
            }
        }
    </script>

</body>
</html>
